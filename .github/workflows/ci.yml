# CI: en cada push y pull request a main, revisa el lint y corre el arnés de
# pruebas de qa/ (el código real de la capa de datos sobre node:sqlite).
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # La app calcula "hoy", el corte y los reportes en hora local: probar
      # con la zona horaria de las tiendas, no con la UTC del servidor.
      TZ: America/Mexico_City
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas (arnés de qa/)
        run: npm test
